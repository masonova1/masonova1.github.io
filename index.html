<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-Threaded ffmpeg.wasm Converter</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; background: #fafafa; margin-top: 20px; }
        button { background: #0076ff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { font-weight: bold; color: #555; margin: 10px 0; }
        #downloadLink { display: inline-block; margin-top: 15px; background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; }
    </style>
    
    <!-- Load UMD bundles to bypass ESM worker origin restrictions -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body>

    <h2>Single-Threaded ffmpeg.wasm Converter</h2>
    <p>Convert an <code>.mp4</code> video to an <code>.mp3</code> audio entirely client-side without special security headers.</p>

    <div class="box">
        <div id="status">Loading FFmpeg core components...</div>
        
        <input type="file" id="uploader" accept="video/mp4" disabled>
        <br><br>
        <button id="convertBtn" disabled>Convert MP4 to MP3</button>
        
        <div id="outputArea"></div>
    </div>

    <script>
        // Extract classes exposed on global window object by UMD scripts
        const { FFmpeg } = FFmpegWASM;
        const { fetchFile, toBlobURL } = FFmpegUtil;

        let ffmpeg = null;
        const uploader = document.getElementById('uploader');
        const convertBtn = document.getElementById('convertBtn');
        const statusDiv = document.getElementById('status');
        const outputArea = document.getElementById('outputArea');

        async function initFFmpeg() {
            try {
                console.log("Creating FFmpeg instance...");
                ffmpeg = new FFmpeg();
                
                ffmpeg.on('log', ({ message }) => {
                    console.log(message);
                    if (message.includes('size=')) {
                        statusDiv.innerText = "Processing conversion chunks...";
                    }
                });

                // Single-threaded core URL (UMD build)
                const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';

                console.log("Downloading core JS and WASM as local Blobs...");
                const coreURL = await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript');
                const wasmURL = await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm');

                console.log("Loading FFmpeg engine...");
                await ffmpeg.load({
                    coreURL,
                    wasmURL
                });

                console.log("FFmpeg loaded successfully!");
                statusDiv.innerText = "FFmpeg Ready! Select an MP4 file.";
                uploader.disabled = false;
            } catch (error) {
                console.error("FFmpeg Load Error:", error);
                statusDiv.innerText = "Failed to load single-threaded FFmpeg. Check browser console for details.";
            }
        }

        uploader.addEventListener('change', () => {
            if (uploader.files.length > 0 && ffmpeg && ffmpeg.loaded) {
                convertBtn.disabled = false;
            }
        });

        convertBtn.addEventListener('click', async () => {
            const files = uploader.files;
            if (!files || files.length === 0) return;
            const file = files[0];

            convertBtn.disabled = true;
            uploader.disabled = true;
            statusDiv.innerText = "Converting... Please wait.";
            outputArea.innerHTML = "";

            const inputName = 'input.mp4';
            const outputName = 'output.mp3';

            try {
                await ffmpeg.writeFile(inputName, await fetchFile(file));
                await ffmpeg.exec(['-i', inputName, '-q:a', '0', '-map', 'a', outputName]);

                const data = await ffmpeg.readFile(outputName);
                const blob = new Blob([data.buffer], { type: 'audio/mp3' });
                const url = URL.createObjectURL(blob);

                const downloadLink = document.createElement('a');
                downloadLink.href = url;
                downloadLink.download = file.name.replace(/\.[^/.]+$/, "") + ".mp3";
                downloadLink.id = "downloadLink";
                downloadLink.innerText = "Download Converted MP3";
                
                outputArea.appendChild(downloadLink);
                statusDiv.innerText = "Conversion Complete!";
            } catch (err) {
                console.error(err);
                statusDiv.innerText = "An error occurred during transcoding.";
            } finally {
                uploader.disabled = false;
                convertBtn.disabled = false;
            }
        });

        initFFmpeg();
    </script>
</body>
</html>
