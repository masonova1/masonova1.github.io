<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-Threaded FFmpeg Direct Engine</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; background: #fafafa; margin-top: 20px; }
        button { background: #0076ff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { font-weight: bold; color: #555; margin: 10px 0; }
        #downloadLink { display: inline-block; margin-top: 15px; background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Single-Threaded FFmpeg Converter</h2>
    <p>Convert an <code>.mp4</code> video to an <code>.mp3</code> audio entirely client-side on standard GitHub Pages.</p>

    <div class="box">
        <div id="status">Loading FFmpeg core components...</div>
        
        <input type="file" id="uploader" accept="video/mp4" disabled>
        <br><br>
        <button id="convertBtn" disabled>Convert MP4 to MP3</button>
        
        <div id="outputArea"></div>
    </div>

    <script>
        const CORE_VERSION = '0.11.1';
        const CDN_BASE = `https://unpkg.com/@ffmpeg/core-st@${CORE_VERSION}/dist`;

        let ffmpegCore = null;
        const uploader = document.getElementById('uploader');
        const convertBtn = document.getElementById('convertBtn');
        const statusDiv = document.getElementById('status');
        const outputArea = document.getElementById('outputArea');

        // Dynamically load the single-threaded standalone JS runtime
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
                document.head.appendChild(script);
            });
        }

        async function initFFmpeg() {
            try {
                statusDiv.innerText = "Fetching single-threaded FFmpeg core...";
                console.log("Loading ffmpeg-core.js directly...");

                await loadScript(`${CDN_BASE}/ffmpeg-core.js`);

                statusDiv.innerText = "Initializing WebAssembly module...";
                console.log("Instantiating FFmpegModule...");

                // Create Emscripten module directly on the main thread
                ffmpegCore = await createFFmpegCore({
                    mainScriptUrlOrBlob: `${CDN_BASE}/ffmpeg-core.js`,
                    print: (text) => console.log("[FFmpeg stdout]:", text),
                    printErr: (text) => {
                        console.log("[FFmpeg stderr]:", text);
                        if (text.includes('size=')) {
                            statusDiv.innerText = "Processing conversion chunks...";
                        }
                    }
                });

                console.log("FFmpeg core initialized successfully!");
                statusDiv.innerText = "FFmpeg Ready! Select an MP4 file.";
                uploader.disabled = false;
            } catch (error) {
                console.error("FFmpeg Direct Load Error:", error);
                statusDiv.innerText = "Failed to load FFmpeg. Check browser console.";
            }
        }

        uploader.addEventListener('change', () => {
            if (uploader.files.length > 0 && ffmpegCore) {
                convertBtn.disabled = false;
            }
        });

        convertBtn.addEventListener('click', async () => {
            const files = uploader.files;
            if (!files || files.length === 0) return;
            const file = files[0];

            convertBtn.disabled = true;
            uploader.disabled = true;
            statusDiv.innerText = "Converting... Please wait.";
            outputArea.innerHTML = "";

            const inputName = 'input.mp4';
            const outputName = 'output.mp3';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);

                // Write file directly to Emscripten Virtual File System (MEMFS)
                ffmpegCore.FS.writeFile(inputName, uint8Array);

                // Convert JS string args to C-style pointers for main() execution
                const args = ['ffmpeg', '-i', inputName, '-q:a', '0', '-map', 'a', outputName];
                const argc = args.length;
                const argv = ffmpegCore._malloc(argc * 4);

                for (let i = 0; i < argc; i++) {
                    const argPtr = ffmpegCore._malloc(args[i].length + 1);
                    ffmpegCore.stringToUTF8(args[i], argPtr, args[i].length + 1);
                    ffmpegCore.setValue(argv + i * 4, argPtr, 'i32');
                }

                // Execute FFmpeg entrypoint directly
                console.log("Executing FFmpeg CLI command...");
                ffmpegCore._main(argc, argv);

                // Read output file from virtual filesystem
                const outputData = ffmpegCore.FS.readFile(outputName);

                // Create download link
                const blob = new Blob([outputData.buffer], { type: 'audio/mp3' });
                const url = URL.createObjectURL(blob);

                const downloadLink = document.createElement('a');
                downloadLink.href = url;
                downloadLink.download = file.name.replace(/\.[^/.]+$/, "") + ".mp3";
                downloadLink.id = "downloadLink";
                downloadLink.innerText = "Download Converted MP3";

                outputArea.appendChild(downloadLink);
                statusDiv.innerText = "Conversion Complete!";

                // Clean up MEMFS files
                ffmpegCore.FS.unlink(inputName);
                ffmpegCore.FS.unlink(outputName);
            } catch (err) {
                console.error("Transcoding Error:", err);
                statusDiv.innerText = "An error occurred during transcoding.";
            } finally {
                uploader.disabled = false;
                convertBtn.disabled = false;
            }
        });

        initFFmpeg();
    </script>
</body>
</html>
